services:
  cloud-drive-backup:
    # Published for amd64 and arm64. Set IMAGE in .env to pin a full commit SHA (ghcr.io/…:<sha>) for a deployment
    # that should change only when you decide, or to an image you built yourself (see README).
    image: ${IMAGE:-ghcr.io/adsdevdoo/cloud-drive-restic-backup:latest}
    container_name: cloud-drive-backup
    restart: unless-stopped
    env_file: .env
    volumes:
      # Account copies, restic repository, tokens, state. Not created when missing: a backup must not land on an
      # empty directory because the backup disk was not mounted.
      - type: bind
        source: ${DATA_DIR:?set DATA_DIR in .env}
        target: /data
        bind: {create_host_path: false}
      # restic_password, <type>_client_id and <type>_client_secret; copy_ssh_key and copy_known_hosts for the
      # off-host copy.
      - ./secrets:/run/secrets:ro
      # Optional: node_exporter textfile collector for the metrics.
      # - /var/lib/node_exporter/textfile:/metrics
    # rclone holds the listing of a Google account in memory (--fast-list; Dropbox and Yandex go folder by folder):
    # about 1 KiB per file, for every source syncing at the time (with one SCHEDULE, all of them). Raise it for half a
    # million files or more in all.
    mem_limit: 1g
    stop_grace_period: 2m
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

  # Google's sign-in only: rclone authorize waits for the browser on 127.0.0.1:53682 of the host, so this one runs on
  # the host's network. Not started by `up`: docker compose run --rm sign-in backup.sh auth <source>
  sign-in:
    image: ${IMAGE:-ghcr.io/adsdevdoo/cloud-drive-restic-backup:latest}
    profiles: [sign-in]
    network_mode: host
    # docker stop then ends a sign-in that waits for the browser at once: the signal goes to rclone too, which bash,
    # waiting for it, would not pass on. (A closed SSH session leaves the container running: the 15 minutes end it.)
    init: true
    environment:
      TINI_KILL_PROCESS_GROUP: "1"
    env_file: .env
    volumes:
      - type: bind
        source: ${DATA_DIR:?set DATA_DIR in .env}
        target: /data
        bind: {create_host_path: false}
      - ./secrets:/run/secrets:ro
